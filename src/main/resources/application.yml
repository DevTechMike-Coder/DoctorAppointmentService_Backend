server:
  port: ${PORT:8080}

spring:
  application:
    name: doctorappointmentservice

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://doctor-appointment-service-frontend.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000