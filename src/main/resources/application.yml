server:
  port: ${PORT:8080}

spring:
  application:
    name: doctorappointmentservice

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  email:
    verification-required: ${EMAIL_VERIFICATION_REQUIRED:false}
    api-key: ${BREVO_API_KEY:}
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:MedBook}
  meeting:
    daily-api-key: ${DAILY_API_KEY:}
    daily-base-url: https://api.daily.co/v1
    # Slot times are zone-less wall-clock values; this is the zone they are interpreted in.
    zone: ${MEETING_ZONE:Africa/Lagos}
    join-early-minutes: 10
    join-late-minutes: 15
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://doctor-appointment-service-frontend.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000